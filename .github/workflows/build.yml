name: Build Taiga arm64 images

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # каждый понедельник, 04:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Пересобрать, даже если образ с такой версией уже есть"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        component: [taiga-back, taiga-front, taiga-events, taiga-protected]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}
    steps:
      - name: Resolve latest upstream release
        id: version
        run: |
          tag=$(git ls-remote --tags --refs --sort=-v:refname \
                  "https://github.com/taigaio/${{ matrix.component }}.git" \
                | awk -F/ '{print $3}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          [ -n "$tag" ] || { echo "Не нашли релизный тег"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Upstream ${{ matrix.component }}: $tag"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already built
        id: check
        run: |
          if [ "${{ inputs.force }}" != "true" ] && \
             docker manifest inspect "$IMAGE:${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:${{ steps.version.outputs.tag }} уже есть, пропускаем"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          repository: taigaio/${{ matrix.component }}
          ref: ${{ steps.version.outputs.tag }}

      # В upstream Dockerfile фронта версия в имени папки внутри zip
      # не совпадает со скачиваемым архивом (качают 6.10.0, распаковывают 6.10.1).
      # Заменяем версию на шаблон, чтобы сборка не зависела от этой рассинхронизации.
      - name: Patch taiga-front Dockerfile
        if: steps.check.outputs.skip != 'true' && matrix.component == 'taiga-front'
        run: |
          sed -i -E 's#"(taiga-contrib-[a-z-]+)-[0-9.]+/#"\1-*/#' docker/Dockerfile
          grep -n unzip docker/Dockerfile

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
